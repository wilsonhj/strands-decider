# v11 arm A: v7's recipe on a question-varied corpus. 30% of v5's rows are replaced by
# the same states asked a transformed question (data/question_transforms.py), so
# steps and compute match v7. Pre-registered in research/preregistrations/PREREGISTRATION-v11.md.
# Build: python -m training.data.question_transforms

train_files: ["data/train_v11a.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3-1.7B-Base"
pointer_dim: 256
kl_frozen_weight: 0.3   # base-torso anchor of the original run, since removed: now needs kl_frozen_reference
head_dropout: 0.05
max_length: 3072

use_lora: true
lora_r: 16
lora_alpha: 32
freeze_torso: false     # true = head-only training (much weaker, but very cheap)

epochs: 1
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001              # LoRA
head_lr: 0.001          # randomly-initialised head needs a bigger step
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true

shuffle_options: true   # the whole point -- do not turn this off
group_by_length: false  # off: v7 trained without it, so each arm changes one thing
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/hobson-1.7b-v11a"
seed: 0
log_every: 20
eval_every: 500
